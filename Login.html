<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Arial', sans-serf;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: url('ttps://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=1600&q=80')
                no-repeat center center/cover;
    position: relative;
}

body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 60, 20, 0.55);
}

.login-container {
    position: relative;
    z-index: 1;
    width: 380px;
    padding: 40px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    text-align: center;
    color: white;
}

.logo {
    font-size: 48px;
    margin-bottom: 10px;
}

h1 {
    font-size: 32px;
    margin-bottom: 8px;
    color: #e8ffe8;
}

.subtitulo {
    font-size: 14px;
    margin-bottom: 30px;
    color: #d6f5d6;
}

.input-group {
    margin-bottom: 20px;
    text-align: left;
}

.input-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #027902;
}

.input-group input {
    width: 100%;
    padding: 12px 15px;
    border: none;
    outline: none;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.9);
    font-size: 7px;
    
}

.input-group input:focus {
    box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.4);
}

.options {
    
    margin-bottom: 20px;
    font-size: 13px;
}

.options a {
    color: #00b800;
    text-decoration: none;
    
}

.options a:hover {
    text-decoration: underline;
}

.login-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #000000, #005f77);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.footer {
    margin-top: 20px;
    font-size: 20px;
    color: #e0ffe0;
}

.footer a {
    color: #0044ff;
    font-weight: bold;
    text-decoration: none;
}

.footer a:hover {
    text-decoration: underline;
}
    </style>
    <body>
        <div class="login-container">
    <div class="logo">🌿</div>
    <h1>Jardin Botânico</h1>
    <p class="subtitle">Entre e explore a beleza da natureza</p>

    <form>
        <div class="input-group">
            <label for="email">E-ail</label>
            <input type="email" id="email">
        </div>

        <div class="input-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>
        </div>

        <div class="options">
            <label>
                <input type="checkbox"> Lembrar-me
            </label>
            <a href="#">Esqueci minha senha</a>
        </div>

        <button type="submit" class="login-btn">Entrar</button>
    </form>

    <div class="footer">
        Não possui conta? <a href="#">Cadastre-se</a>
    </div>
</div>
    </body>
</body>
</html>
