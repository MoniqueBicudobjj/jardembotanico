<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floricultura</title>
    <link rel="stylesheet" href="../CSS/floricultura.css">
</head>
    <body>

    <div class="container">
        <h1>Floricultura</h1>
        
        <div class="flowers-grid">
            
            <div class="flower-card">
                <div class="flower-header">
                    <div class="marker"></div>
                    <span class="flower-name">Tulipa</span>
                </div>
                <img class="flower-image" src="" alt="Tulipas">
            </div>

            <div class="flower-card">
                <div class="flower-header">
                    <div class="marker"></div>
                    <span class="flower-name">Íris</span>
                </div>
                <img class="flower-image" src="" alt="Flor Íris">
            </div>

            <div class="flower-card">
                <div class="flower-header">
                    <div class="marker"></div>
                    <span class="flower-name">Rosa</span>
                </div>
                <img class="flower-image" src="" alt="Rosas">
            </div>

            <div class="flower-card">
                <div class="flower-header">
                    <div class="marker"></div>
                    <span class="flower-name">Hortênsia</span>
                </div>
                <img class="flower-image" src="" alt="Hortênsia">
            </div>

        </div>
    </div>

</body>
</html>
